[project]
name = "condomanager"
version = "0.1.0"
description = "Sistema Automatizado de Gestión de Pagos, Morosidad y Reservas para Condominios"
readme = "specs/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
