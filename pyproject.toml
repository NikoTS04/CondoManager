[project]
name = "condomanager"
version = "0.1.0"
description = "Sistema Automatizado de Gestión de Pagos, Morosidad y Reservas para Condominios"
readme = "specs/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "Pillow>=11.0.0",
    "pypdf>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=6.0.0",
    "jsonschema>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "strict"
markers = ["postgres: integración que requiere PostgreSQL real y CON13_TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*"]
# SQLAlchemy async usa greenlets: sin este seguimiento se pierden líneas ejecutadas.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
precision = 2
include_namespace_packages = true
# Base medida con Python 3.12 y entorno CI: 81,19 %, incluidos módulos no importados.
fail_under = 80
