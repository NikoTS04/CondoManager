extends:
  - spectral:oas

functionsDir: .spectral-functions
functions:
  - oasDocumentSchema

# La estructura y referencias siguen siendo bloqueantes. La documentación
# incompleta del contrato actual se publica como warnings, no se oculta.
# Advertencias documentales visibles (contacto, descripciones y tags); el corte
# financiero añade operaciones a la línea base histórica de 20 warnings.
# TODO: completar esa documentación en specs/ antes de exigir cero warnings.
rules:
  info-contact: warn
  operation-description: warn
  operation-tags: warn
  oas3-api-servers: warn

  # Validar Path Items externos tras resolverlos: el validador sin resolver de
  # Spectral 6.15 rechaza $ref con unevaluatedProperties en OpenAPI 3.1.
  # Las referencias rotas siguen siendo errores del resolver.
  oas3-schema:
    resolved: true
    given: $
    then:
      function: oasDocumentSchema
