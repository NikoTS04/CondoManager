name: Docker

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Docker / Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir API sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Construir web sin publicar
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  smoke:
    name: Docker / Smoke compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: condomanager-ci
    steps:
      - uses: actions/checkout@v4
      - name: Generar credenciales efímeras sin .env
        run: |
          db_password=$(openssl rand -hex 24)
          jwt_secret=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "CI_DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "CI_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Cargar imagen API desde caché
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: condomanager-api:ci
          cache-from: type=gha,scope=api
      - name: Cargar imagen web desde caché
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: condomanager-web:ci
          cache-from: type=gha,scope=web
      - name: Levantar servicios y esperar healthchecks
        run: docker compose --env-file /dev/null up -d --no-build --wait --wait-timeout 180
      - name: Verificar migraciones y escenario piloto
        # El CMD ya migra antes de arrancar; repetir comprueba idempotencia.
        # Estos scripts verifican el dataset y servicios en memoria, no insertan filas.
        run: |
          docker compose --env-file /dev/null exec -T backend python -m alembic upgrade head
          docker compose --env-file /dev/null exec -T backend python scripts/seed_condominio_piloto.py
          docker compose --env-file /dev/null exec -T backend python scripts/verify_pilot_e2e.py
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://localhost:8000/health
          curl --fail --silent --show-error --retry 5 --retry-connrefused --output /dev/null http://localhost:3000/
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color
      - name: Eliminar servicios y volúmenes siempre
        if: always()
        run: docker compose --env-file /dev/null down -v --remove-orphans
