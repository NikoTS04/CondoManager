name: Specs

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: specs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdd:
    name: Specs / Cumplimiento SDD
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar especificaciones, BDD, precisión y auditoría
        run: python scripts/verify_sdd_compliance.py

  openapi:
    name: Specs / OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato formal con Spectral
        # Los warnings quedan visibles; errores de estructura/referencias bloquean.
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint --ruleset .spectral.yaml --fail-severity error specs/03-contracts/openapi/condomanager.openapi.yaml

  contrato:
    name: Specs / Contrato API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_STRICT_ENFORCEMENT: 'true'
      DATABASE_URL: postgresql+asyncpg://condo_user:condo_secret@localhost:5432/condomanager
      REDIS_URL: redis://localhost:6379/0
      CONDOMINIO_PILOTO_ID: ''
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: condo_user
          POSTGRES_PASSWORD: condo_secret
          POSTGRES_DB: condomanager
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U condo_user -d condomanager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Preparar esquema persistente de autenticación
        run: |
          uv run --extra dev alembic upgrade head
          uv run --extra dev python -m scripts.seed_usuarios_demo
          uv run --extra dev python -m scripts.seed_areas_demo
      - name: Probar contrato generado contra FastAPI en modo ASGI
        # No sustituye validación de respuestas ni flujos autenticados completos.
        # El login consulta PostgreSQL; las rutas públicas siguen sin Redis.
        run: uv run --extra dev --with schemathesis==4.22.1 python -m pytest -q scripts/ci/verify_api_contract.py
      - name: Verificar respuestas y eventos contra CON-72
        env:
          # Los fixtures compartidos resuelven CON13_TEST_DATABASE_URL.
          # CON73_TEST_DATABASE_URL omitía silenciosamente sus pruebas SQL.
          CON13_TEST_DATABASE_URL: postgresql+asyncpg://condo_user:condo_secret@localhost:5432/condomanager
        run: uv run --extra dev python -m pytest -q src/tests/integration/test_convergencia_con72.py
