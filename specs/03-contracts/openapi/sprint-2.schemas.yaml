# Esquemas del contrato objetivo de CON-72. No registran endpoints en FastAPI.
# Los esquemas de usuarios, roles, vínculos y catálogo CON-39 se conservan en el documento principal.
schemas:
  UUID:
    type: string
    format: uuid
  Dinero:
    type: string
    pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
    description: Importe no negativo NUMERIC(12,2), siempre como cadena de dos decimales.
    examples: ['0.00', '150.00']
  DineroPositivo:
    type: string
    pattern: '^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,9}\.[0-9]{2})$'
  HoraLocal:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:00$'
    description: Hora de America/Lima con precisión de minuto; segundos siempre 00.
    examples: ['19:00:00']
  InstanteUTC:
    type: string
    format: date-time
    pattern: '(Z|\+00:00)$'
  Error:
    type: object
    additionalProperties: false
    required: [error_code, mensaje]
    properties:
      error_code: {type: string, minLength: 1}
      mensaje: {type: string, minLength: 1}
      detalles:
        type: object
        additionalProperties: true
        description: Detalles autorizados; validaciones en detalles.errores, sin valores sensibles.
  HorarioOcupado:
    type: object
    additionalProperties: false
    required: [hora_inicio, hora_fin]
    properties:
      hora_inicio: {$ref: '#/schemas/HoraLocal'}
      hora_fin: {$ref: '#/schemas/HoraLocal'}
  CrearReserva:
    type: object
    additionalProperties: false
    required: [condominio_id, area_id, departamento_id, fecha_reserva, hora_inicio, hora_fin]
    properties:
      condominio_id: {$ref: '#/schemas/UUID'}
      area_id: {$ref: '#/schemas/UUID'}
      departamento_id: {$ref: '#/schemas/UUID'}
      fecha_reserva: {type: string, format: date}
      hora_inicio: {$ref: '#/schemas/HoraLocal'}
      hora_fin: {$ref: '#/schemas/HoraLocal'}
  Reserva:
    type: object
    additionalProperties: false
    required: [id, condominio_id, area_id, departamento_id, fecha_reserva, hora_inicio, hora_fin, zona_horaria, costo_reserva, moneda, estado, creado_en]
    properties:
      id: {$ref: '#/schemas/UUID'}
      condominio_id: {$ref: '#/schemas/UUID'}
      area_id: {$ref: '#/schemas/UUID'}
      area_nombre: {type: [string, 'null']}
      departamento_id: {$ref: '#/schemas/UUID'}
      fecha_reserva: {type: string, format: date}
      hora_inicio: {$ref: '#/schemas/HoraLocal'}
      hora_fin: {$ref: '#/schemas/HoraLocal'}
      zona_horaria: {type: string, enum: [America/Lima, UTC], description: America/Lima para nuevas reservas; UTC solo para registros históricos sin marca local.}
      costo_reserva: {$ref: '#/schemas/Dinero'}
      moneda: {type: string, enum: [PEN, USD]}
      estado: {type: string, enum: [SOLICITADA, CONFIRMADA, RECHAZADA, CANCELADA, COMPLETADA]}
      creado_en: {$ref: '#/schemas/InstanteUTC'}
  ReservaConfirmada:
    allOf:
      - {$ref: '#/schemas/Reserva'}
    properties:
      estado: {type: string, const: CONFIRMADA}
      zona_horaria: {type: string, const: America/Lima}
  CancelarReserva:
    type: object
    additionalProperties: false
    properties:
      motivo: {type: string, minLength: 1, maxLength: 500, default: Cancelación voluntaria}
      es_admin:
        type: boolean
        deprecated: true
        description: Compatibilidad temporal; se ignora. El permiso procede de la sesión.
  AjusteCancelacion:
    type: object
    additionalProperties: false
    required: [estado, monto, referencia]
    properties:
      estado: {type: string, enum: [NO_APLICA, PENDIENTE, APLICADO]}
      monto: {$ref: '#/schemas/Dinero'}
      referencia: {type: [string, 'null'], format: uuid}
    allOf:
      - if:
          properties: {estado: {const: NO_APLICA}}
        then:
          properties: {monto: {const: '0.00'}, referencia: {type: 'null'}}
      - if:
          properties: {estado: {const: APLICADO}}
        then:
          properties:
            referencia: {type: string, format: uuid}
  ReservaCancelada:
    type: object
    additionalProperties: false
    required: [id, estado, mensaje, fecha_cancelacion, ajuste_economico]
    properties:
      id: {$ref: '#/schemas/UUID'}
      estado: {type: string, const: CANCELADA}
      mensaje: {type: string}
      fecha_cancelacion: {$ref: '#/schemas/InstanteUTC'}
      ajuste_economico: {$ref: '#/schemas/AjusteCancelacion'}
  ReportarPago:
    type: object
    additionalProperties: false
    required: [departamento_id, banco, numero_operacion, fecha_operacion, monto, archivo_voucher]
    properties:
      departamento_id: {$ref: '#/schemas/UUID'}
      banco:
        type: string
        minLength: 1
        maxLength: 50
        description: Quitar espacios y convertir a mayúsculas; el valor normalizado debe ser YAPE, PLIN, BCP, INTERBANK, BBVA o SCOTIABANK.
        examples: [YAPE, ' b c p ']
      numero_operacion:
        type: string
        minLength: 1
        maxLength: 50
        pattern: '\S'
        description: Rechazar blanco; quitar espacios y ceros iniciales, conservando 0 si solo hay ceros.
      fecha_operacion: {type: string, format: date}
      monto: {$ref: '#/schemas/DineroPositivo'}
      archivo_voucher:
        type: string
        format: binary
        description: PNG, JPEG o PDF; máximo 5242880 bytes. Validar contenido, no solo extensión.
        x-max-bytes: 5242880
  EstadoComprobante:
    type: string
    enum: [EN_REVISION, APROBADO, OBSERVADO, RECHAZADO]
  ComprobanteRecibido:
    type: object
    additionalProperties: false
    required: [comprobante_id, estado, codigo, mensaje, idempotency_hash]
    properties:
      comprobante_id: {$ref: '#/schemas/UUID'}
      estado: {type: string, const: EN_REVISION}
      codigo: {type: string, enum: [COMPROBANTE_RECIBIDO, VOUCHER_EN_EVALUACION]}
      mensaje: {type: string}
      idempotency_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
  Comprobante:
    type: object
    additionalProperties: false
    required: [id, departamento_id, banco, numero_operacion, fecha_operacion, monto, estado, idempotency_hash, url_voucher, motivo_rechazo]
    properties:
      id: {$ref: '#/schemas/UUID'}
      departamento_id: {$ref: '#/schemas/UUID'}
      banco: {type: string}
      numero_operacion: {type: string}
      fecha_operacion: {type: string, format: date}
      monto: {$ref: '#/schemas/DineroPositivo'}
      estado: {$ref: '#/schemas/EstadoComprobante'}
      idempotency_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
      url_voucher:
        type: string
        description: Ruta autenticada generada por servidor; no URL pública del objeto S3.
        examples: ['/api/v1/pagos/75e9efb4-b726-4bc0-a8d6-170fbbbcf614/voucher']
      motivo_rechazo: {type: [string, 'null']}
  ConciliarPago:
    type: object
    additionalProperties: false
    required: [decision]
    properties:
      decision: {type: string, enum: [APROBADO, RECHAZADO, OBSERVADO]}
      motivo_rechazo: {type: [string, 'null'], minLength: 1, maxLength: 2000}
      notas_internas: {type: [string, 'null'], maxLength: 2000}
    allOf:
      - if:
          properties: {decision: {enum: [OBSERVADO, RECHAZADO]}}
        then:
          required: [motivo_rechazo]
          properties: {motivo_rechazo: {type: string, minLength: 1}}
  ResultadoRevision:
    type: object
    additionalProperties: false
    required: [comprobante_id, estado_final, monto_imputado, nuevo_saldo_departamento, saldo_a_favor_generado, departamento_habilitado_reservas, motivo_rechazo]
    properties:
      comprobante_id: {$ref: '#/schemas/UUID'}
      estado_final: {type: string, enum: [APROBADO, RECHAZADO, OBSERVADO]}
      monto_imputado: {$ref: '#/schemas/Dinero'}
      nuevo_saldo_departamento: {$ref: '#/schemas/Dinero'}
      saldo_a_favor_generado: {$ref: '#/schemas/Dinero'}
      departamento_habilitado_reservas: {type: boolean}
      motivo_rechazo: {type: [string, 'null']}
  Notificacion:
    type: object
    additionalProperties: false
    required: [id, condominio_id, departamento_id, usuario_destinatario_id, evento_id, tipo_evento, canal, destinatario, asunto, cuerpo, estado, ciclo, intentos, proximo_reintento, proveedor_message_id, error_mensaje, transporte, fecha_creacion, fecha_actualizacion]
    properties:
      id: {$ref: '#/schemas/UUID'}
      condominio_id: {$ref: '#/schemas/UUID'}
      departamento_id: {type: [string, 'null'], format: uuid}
      usuario_destinatario_id: {type: [string, 'null'], format: uuid}
      evento_id: {type: [string, 'null'], format: uuid}
      tipo_evento: {type: string}
      canal: {type: string, enum: [EMAIL, WHATSAPP, SMS, PUSH]}
      destinatario: {type: string}
      asunto: {type: [string, 'null']}
      cuerpo: {type: string}
      estado: {type: string, enum: [EN_COLA, ENVIADO, ENTREGADO, REINTENTANDO, FALLIDO_PERMANENTE]}
      ciclo: {type: integer, minimum: 1}
      intentos: {type: integer, minimum: 0, maximum: 4}
      proximo_reintento: {type: [string, 'null'], format: date-time}
      proveedor_message_id: {type: [string, 'null']}
      error_mensaje: {type: [string, 'null']}
      transporte: {type: string, enum: [SIMULADO, PROVEEDOR]}
      fecha_creacion: {$ref: '#/schemas/InstanteUTC'}
      fecha_actualizacion: {$ref: '#/schemas/InstanteUTC'}
  AlertaNotificacion:
    type: object
    additionalProperties: false
    required: [id, notificacion_id, condominio_id, departamento_id, departamento_numero, tipo_evento, ciclo, tipo, mensaje, estado, creada_en, atendida_en, atendida_por]
    properties:
      id: {$ref: '#/schemas/UUID'}
      notificacion_id: {$ref: '#/schemas/UUID'}
      condominio_id: {$ref: '#/schemas/UUID'}
      departamento_id: {$ref: '#/schemas/UUID'}
      departamento_numero: {type: string}
      tipo_evento: {type: string}
      ciclo: {type: integer, minimum: 1}
      tipo: {type: string, enum: [ERROR_DEFINITIVO, INTENTOS_AGOTADOS, ACEPTACION_INCIERTA, DESTINATARIO_INVALIDO, PROVEEDOR_NO_CONFIGURADO]}
      mensaje: {type: string, description: Texto operativo sin contactos ni datos sensibles.}
      estado: {type: string, enum: [ABIERTA, ATENDIDA]}
      creada_en: {$ref: '#/schemas/InstanteUTC'}
      atendida_en: {type: [string, 'null'], format: date-time}
      atendida_por: {type: [string, 'null'], format: uuid}
  DespacharNotificacion:
    type: object
    additionalProperties: false
    required: [condominio_id, departamento_id, tipo_evento, canal, destinatario, contexto]
    properties:
      condominio_id: {$ref: '#/schemas/UUID'}
      departamento_id: {$ref: '#/schemas/UUID'}
      tipo_evento: {type: string}
      canal: {type: string, enum: [EMAIL, WHATSAPP, SMS, PUSH]}
      destinatario: {type: string, minLength: 1}
      contexto: {type: object, additionalProperties: true}
  ComunicadoMasivo:
    type: object
    additionalProperties: false
    required: [condominio_id, titulo, mensaje]
    properties:
      condominio_id: {$ref: '#/schemas/UUID'}
      titulo: {type: string, minLength: 5, maxLength: 150}
      mensaje: {type: string, minLength: 10}
      canal: {type: string, enum: [EMAIL, WHATSAPP, SMS, PUSH], default: EMAIL}
      remitente: {type: string, maxLength: 150}
  ComunicadoAceptado:
    type: object
    additionalProperties: false
    required: [condominio_id, generadas, estado_general]
    properties:
      condominio_id: {$ref: '#/schemas/UUID'}
      generadas: {type: integer, minimum: 0}
      estado_general: {type: string, const: EN_COLA}
