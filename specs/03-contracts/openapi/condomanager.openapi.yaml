openapi: 3.1.0
info:
  title: CondoManager API
  description: API formal para el Sistema Automatizado de Gestión de Pagos, Morosidad y Reservas para Condominios (SDD).
  version: 1.5.0
security: [{ bearerAuth: [] }]
servers:
  - url: http://localhost:8000/api/v1
    description: Servidor de desarrollo local
tags:
  - name: Usuarios y permisos
    description: Asignaciones contextuales y revocación de permisos.
  - name: Cuotas de Mantenimiento
    description: Presupuestos y emisión mensual de cuotas.
paths:
  /auth/login:
    post:
      operationId: iniciarSesion
      summary: Autenticación persistente de cuentas activas y sesión v2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 120 }
                password: { type: string, format: password, maxLength: 128 }
                condominio_id: { type: [string, 'null'], format: uuid }
              additionalProperties: false
      responses:
        '200':
          description: JWT con session_version 2 y perfil con roles SQL
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, usuario]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: bearer }
                  expires_in: { type: integer, const: 86400 }
                  usuario: { $ref: '#/components/schemas/UsuarioDTO' }
        '401': { $ref: '#/components/responses/Error401' }
        '409':
          description: Seleccione un contexto de detalles.condominios tras validar las credenciales
        '422': { description: 'DATOS_USUARIO_INVALIDOS, sin incluir contraseñas en el error' }
  /auth/me:
    get:
      operationId: contextoSesion
      summary: Perfil y vínculos activos de la sesión autenticada
      responses:
        '200':
          description: Perfil coherente con el login; nombres completos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioDTO' }
        '401': { $ref: '#/components/responses/Error401' }
  /auth/demo-users:
    get:
      operationId: listarUsuariosDemo
      summary: Perfiles demo persistidos disponibles exclusivamente en DEMO_MODE
      security: []
      responses:
        '200':
          description: Perfiles sin contraseñas ni tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UsuarioDTO' } }
        '404': { description: Modo demo deshabilitado }
  /condominios/{condominio_id}/usuarios:
    parameters:
      - { name: condominio_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listarUsuariosCondominio
      summary: Listar cuentas activas e inactivas del contexto administrativo
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Cuentas del condominio sin secretos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CuentaUsuarioConRol' } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio no encontrado }
        '422': { description: Parámetros de consulta inválidos }
    post:
      operationId: crearUsuarioInactivo
      summary: Registrar cuenta inactiva con contraseña inicial y rol RESIDENTE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearUsuario' }
      responses:
        '201':
          description: Cuenta y auditoría confirmadas; esta_activo es false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuentaUsuario' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio no encontrado }
        '409': { description: 'USUARIO_DUPLICADO, correo o documento ya registrado' }
        '422': { description: 'DATOS_USUARIO_INVALIDOS, sin incluir contraseñas en el error' }
  /condominios/{condominio_id}/usuarios/{usuario_id}/rol:
    parameters:
      - { name: condominio_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: consultarRolUsuario
      summary: Consultar la asignación contextual vigente o revocada
      description: Administración autorizada; no revela identidades ajenas a Junta.
      tags: [Usuarios y permisos]
      responses:
        '200':
          description: Asignación persistida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionRol' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Contexto o asignación no encontrados }
        '422': { description: DATOS_ROL_INVALIDOS }
    put:
      operationId: asignarRolUsuario
      summary: Crear, cambiar o reactivar un rol contextual
      description: SuperAdmin gestiona los tres roles; Junta solo Auditor/Residente de su condominio. Prohíbe autoasignación y cambios de concesión global. Un cambio real revoca sesiones y audita atómicamente.
      tags: [Usuarios y permisos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rol]
              properties:
                rol: { $ref: '#/components/schemas/RolContextual' }
      responses:
        '200':
          description: Asignación activa; repetir el rol vigente es un no-op
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionRol' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Contexto o usuario no encontrados o asignación ajena a Junta }
        '422': { description: DATOS_ROL_INVALIDOS }
    delete:
      operationId: revocarRolUsuario
      summary: Revocar lógicamente una asignación conservando su historial
      description: Aplica la misma autoridad que PUT. La revocación repetida es un no-op. No modifica el estado global de cuenta ni los vínculos de departamentos.
      tags: [Usuarios y permisos]
      responses:
        '200':
          description: Asignación con es_activo false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionRol' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Contexto o asignación no encontrados }
        '422': { description: DATOS_ROL_INVALIDOS }
  /usuarios/{usuario_id}/estado:
    patch:
      operationId: cambiarEstadoUsuario
      summary: SuperAdmin habilita o deshabilita la cuenta global e invalida sus sesiones
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: condominio_id, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [esta_activo]
              properties:
                esta_activo: { type: boolean }
      responses:
        '200':
          description: Cuenta persistida; repetir el estado no produce efectos adicionales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuentaUsuario' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Usuario no encontrado en el contexto seleccionado }
        '422': { description: DATOS_USUARIO_INVALIDOS }
  /cuotas/departamentos:
    get:
      operationId: departamentosDelPortal
      summary: Unidades autorizadas del catálogo piloto
      parameters:
        - $ref: '#/components/parameters/ContextoConsulta'
      responses:
        '200':
          description: Unidades del contexto; RESIDENTE solo recibe vínculos activos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DepartamentoPortal' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /pagos/comprobantes:
    get:
      operationId: listarComprobantes
      summary: Comprobantes de unidades autorizadas en el contexto
      parameters:
        - $ref: '#/components/parameters/ContextoConsulta'
      responses:
        '200':
          description: Comprobantes autorizados; nunca datos de otra unidad para residentes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ComprobantePagoDTO' } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /areas:
    get:
      operationId: listarAreas
      summary: Áreas comunes activas del contexto autorizado
      parameters:
        - $ref: '#/components/parameters/ContextoConsulta'
      responses:
        '200': { description: Catálogo contextual de áreas comunes }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /areas/{area_id}/disponibilidad:
    get:
      operationId: disponibilidadArea
      summary: Horarios ocupados sin información privada de otras unidades
      parameters:
        - { name: area_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fecha, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Intervalos ocupados
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [hora_inicio, hora_fin]
                  properties:
                    hora_inicio: { type: string }
                    hora_fin: { type: string }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /reservas/{reserva_id}/cancelar:
    post:
      operationId: cancelarReserva
      summary: Cancelar una reserva autorizada; permiso administrativo derivado del JWT
      parameters:
        - { name: reserva_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
                es_admin: { type: boolean, description: Compatibilidad; el servidor no confía en este valor }
      responses:
        '200': { description: Reserva cancelada }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '422': { description: Cancelación fuera del plazo o estado no permitido }
  /moras/evaluar:
    post:
      operationId: evaluarMoras
      summary: Simular evaluación de moras; solo administración del contexto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominio_id]
              properties:
                condominio_id: { type: string, format: uuid }
                fecha_corte: { type: string, format: date }
      responses:
        '200': { description: Resultado de evaluación piloto }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /notificaciones/logs:
    get:
      operationId: listarNotificaciones
      summary: Bitácora del contexto para administración y auditoría
      parameters:
        - $ref: '#/components/parameters/ContextoConsulta'
        - { name: departamento_id, in: query, schema: { type: string, format: uuid } }
        - { name: estado, in: query, schema: { type: string, enum: [EN_COLA, ENTREGADO, REINTENTANDO, FALLIDO_PERMANENTE] } }
        - { name: canal, in: query, schema: { type: string, enum: [EMAIL, WHATSAPP, SMS, PUSH] } }
      responses:
        '200': { description: Notificaciones exclusivamente del contexto autorizado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /notificaciones/despachar:
    post:
      operationId: despacharNotificacion
      summary: Despacho manual exclusivo de administración del contexto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominio_id, departamento_id, tipo_evento, destinatario, contexto]
              properties:
                condominio_id: { type: string, format: uuid }
                departamento_id: { type: string, format: uuid }
                tipo_evento: { type: string }
                destinatario: { type: string }
                canal: { type: string, enum: [EMAIL, WHATSAPP, SMS, PUSH] }
                contexto: { type: object }
      responses:
        '201': { description: Notificación despachada }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /notificaciones/reenviar/{log_id}:
    post:
      operationId: reenviarNotificacion
      summary: Reenvío manual exclusivo de administración del recurso
      parameters:
        - { name: log_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuevo_destinatario: { type: [string, 'null'] }
      responses:
        '200': { description: Notificación reenviada }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /notificaciones/comunicado-masivo:
    post:
      operationId: enviarComunicadoMasivo
      summary: Comunicado a unidades activas del contexto autorizado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominio_id, titulo, mensaje]
              properties:
                condominio_id: { type: string, format: uuid }
                titulo: { type: string, minLength: 5, maxLength: 150 }
                mensaje: { type: string, minLength: 10 }
                canal: { type: string, enum: [EMAIL, WHATSAPP, SMS, PUSH] }
                remitente: { type: string }
      responses:
        '202': { description: Comunicado generado en el catálogo piloto }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /condominios/{condominio_id}/edificios:
    parameters:
      - $ref: '#/components/parameters/ContextoEstructura'
    get:
      operationId: listarEdificios
      summary: Listar edificios del condominio
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Edificios persistidos del contexto autorizado
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EdificioResponse' } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio activo no encontrado }
    post:
      operationId: crearEdificio
      summary: Registrar edificio (CON-3)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearEdificioRequest' }
      responses:
        '201':
          description: Edificio persistido con auditoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdificioResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio activo no encontrado }
        '409': { description: EDIFICIO_DUPLICADO o ESTRUCTURA_DUPLICADA }
        '422': { description: DATOS_ESTRUCTURA_INVALIDOS }
  /condominios/{condominio_id}/departamentos:
    parameters:
      - $ref: '#/components/parameters/ContextoEstructura'
    get:
      operationId: listarDepartamentos
      summary: Listar unidades persistidas, incluyendo inactivas
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: edificio_id, in: query, schema: { type: string, format: uuid } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Padrón contextual
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepartamentoResponse' } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio o edificio no encontrado en el contexto }
        '422': { description: DATOS_ESTRUCTURA_INVALIDOS }
  /condominios/{condominio_id}/edificios/{edificio_id}/departamentos:
    parameters:
      - $ref: '#/components/parameters/ContextoEstructura'
      - { name: edificio_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: crearDepartamento
      summary: Registrar departamento activo (CON-3)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearDepartamentoRequest' }
      responses:
        '201':
          description: Unidad persistida con saldo cero y estado AL_DIA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartamentoResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio o edificio no encontrado }
        '409': { description: DEPARTAMENTO_DUPLICADO o ESTRUCTURA_DUPLICADA }
        '422': { description: DATOS_ESTRUCTURA_INVALIDOS o PISO_INVALIDO }
  /condominios/{condominio_id}/departamentos/{departamento_id}/estado:
    parameters:
      - $ref: '#/components/parameters/ContextoEstructura'
      - { name: departamento_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: cambiarEstadoDepartamento
      summary: Activar o desactivar conservando el historial
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activo]
              properties: { activo: { type: boolean } }
      responses:
        '200':
          description: Estado vigente; un estado idéntico no duplica auditoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartamentoResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio o departamento no encontrado }
        '422': { description: DATOS_ESTRUCTURA_INVALIDOS }
  /condominios/{condominio_id}/importaciones/previsualizar:
    parameters:
      - $ref: '#/components/parameters/ContextoEstructura'
    post:
      operationId: previsualizarEstructura
      summary: Validar CSV sin escrituras (administradores)
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ArchivoEstructura' }
      responses:
        '200':
          description: Vista previa con estado y errores por fila
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportacionEstructuraResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio activo no encontrado }
        '422': { description: CSV_INVALIDO o DATOS_ESTRUCTURA_INVALIDOS }
  /condominios/{condominio_id}/importaciones/confirmar:
    parameters:
      - $ref: '#/components/parameters/ContextoEstructura'
    post:
      operationId: confirmarEstructura
      summary: Revalidar CSV e importar filas válidas sin duplicados
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ArchivoEstructura' }
      responses:
        '200':
          description: Resultado persistido; datos existentes diferentes se reportan como error por fila
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportacionEstructuraResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: Condominio activo no encontrado }
        '422': { description: CSV_INVALIDO o DATOS_ESTRUCTURA_INVALIDOS }
  /condominios/{condominio_id}/distribucion:
    parameters:
      - name: condominio_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Configurar el método de distribución (CON-10)
      operationId: configurarDistribucion
      description: >-
        SUPERADMIN o ADMIN_JUNTA del condominio. Valida departamentos y suma exacta
        100.0000 para POR_ALICUOTA; EQUITATIVA requiere al menos un departamento.
        El mismo método válido conserva actor, fecha y auditoría. Cada cambio
        se audita transaccionalmente. No versiona por periodo ni ajusta residuos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurarDistribucionRequest'
      responses:
        '200':
          description: Configuración vigente validada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistribucionResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: DISTRIBUCION_ACCESO_DENEGADO por rol o condominio ajeno
        '404':
          description: CONDOMINIO_NO_ENCONTRADO
        '422':
          description: >-
            DATOS_DISTRIBUCION_INVALIDOS, DISTRIBUCION_SIN_DEPARTAMENTOS o
            DISTRIBUCION_COEFICIENTES_INVALIDOS; error_code y mensaje claros.
    get:
      summary: Consultar el método de distribución (CON-10)
      operationId: obtenerDistribucion
      description: >-
        Lectura para SUPERADMIN, ADMIN_JUNTA y AUDITOR; salvo SUPERADMIN se exige
        contexto propio. Devuelve configuración persistida sin revalidar departamentos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuración vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistribucionResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: DISTRIBUCION_ACCESO_DENEGADO
        '404':
          description: CONDOMINIO_NO_ENCONTRADO o DISTRIBUCION_NO_CONFIGURADA
        '422':
          description: DATOS_DISTRIBUCION_INVALIDOS por UUID inválido
  /health:
    get:
      security: []
      summary: Comprobación de estado del servicio
      operationId: healthCheck
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  service: { type: string, example: "CondoManager Core API" }

  /condominios:
    get:
      summary: Listar condominios activos
      description: >-
        Devuelve los condominios activos disponibles para que un SUPERADMIN
        seleccione explícitamente el contexto operativo.
      operationId: listarCondominios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de condominios activos ordenada por creación descendente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CondominioResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    post:
      summary: Crear y configurar un condominio
      description: >-
        Crea la raíz de un contexto multi-condominio y su auditoría en una sola
        transacción. Operación exclusiva del rol global SUPERADMIN.
      operationId: crearCondominio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearCondominioRequest'
      responses:
        '201':
          description: Condominio creado, activo y auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondominioResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'

  /condominios/{condominio_id}:
    get:
      summary: Consultar un condominio por UUID
      description: Devuelve exactamente la configuración persistida para el UUID solicitado.
      operationId: obtenerCondominio
      security:
        - bearerAuth: []
      parameters:
        - name: condominio_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Condominio encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondominioResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /presupuestos:
    post:
      summary: Registrar un presupuesto mensual en borrador
      description: >-
        Crea un único presupuesto ordinario por condominio y periodo. Disponible
        para SUPERADMIN y ADMIN_JUNTA dentro de su contexto autorizado.
      operationId: crearPresupuestoMensual
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPresupuestoRequest'
      responses:
        '201':
          description: Presupuesto creado en estado BORRADOR y auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresupuestoResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/ErrorPresupuesto403'
        '404':
          $ref: '#/components/responses/ErrorPresupuesto404'
        '409':
          $ref: '#/components/responses/ErrorPresupuesto409'
        '422':
          $ref: '#/components/responses/ErrorPresupuesto422'

  /presupuestos/{id}:
    put:
      summary: Modificar un presupuesto mensual en borrador
      description: >-
        Reemplaza los datos editables. El identificador y el condominio son
        inmutables; un presupuesto APROBADO responde 409.
      operationId: actualizarPresupuestoMensual
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPresupuestoRequest'
      responses:
        '200':
          description: Borrador reemplazado y modificación auditada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresupuestoResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/ErrorPresupuesto403'
        '404':
          $ref: '#/components/responses/ErrorPresupuesto404'
        '409':
          $ref: '#/components/responses/ErrorPresupuesto409'
        '422':
          $ref: '#/components/responses/ErrorPresupuesto422'

  /presupuestos/{id}/aprobar:
    post:
      summary: Aprobar un presupuesto mensual
      description: >-
        Ejecuta la transición BORRADOR a APROBADO y registra el claim sub del
        actor y la fecha UTC dentro de la misma transacción de auditoría.
      operationId: aprobarPresupuestoMensual
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Presupuesto aprobado y auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresupuestoResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/ErrorPresupuesto403'
        '404':
          $ref: '#/components/responses/ErrorPresupuesto404'
        '409':
          $ref: '#/components/responses/ErrorPresupuesto409'
        '422':
          $ref: '#/components/responses/ErrorPresupuesto422'

  /condominios/{condominio_id}/presupuestos/{periodo}:
    get:
      summary: Consultar el presupuesto de un condominio y periodo
      description: >-
        Devuelve el BORRADOR o APROBADO existente sin cruzar contextos. AUDITOR
        puede usar esta consulta dentro de su condominio. CON-11 debe aceptar el
        resultado como fuente de emisión únicamente cuando estado sea APROBADO.
      operationId: obtenerPresupuestoPorPeriodo
      security:
        - bearerAuth: []
      parameters:
        - name: condominio_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: periodo
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
      responses:
        '200':
          description: Presupuesto encontrado dentro del contexto autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresupuestoResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/ErrorPresupuesto403'
        '404':
          $ref: '#/components/responses/ErrorPresupuesto404'
        '422':
          $ref: '#/components/responses/ErrorPresupuesto422'

  /cuotas/emitir-lote:
    post:
      summary: Emisión masiva mensual de cuotas ordinarias
      description: Emite un lote persistente desde el presupuesto aprobado, aplica saldos a favor y registra el evento de forma transaccional.
      tags: [Cuotas de Mantenimiento]
      operationId: emitirLoteCuotas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirLoteCuotasRequest'
      responses:
        '201':
          description: Lote de cuotas emitido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitirLoteCuotasResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: Lote ya emitido o presupuesto no aprobado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /pagos/vouchers:
    post:
      summary: Subir evidencia local privada para un departamento autorizado
      operationId: subirVoucher
      description: PNG/JPG/PDF de hasta 5 MiB; devuelve solo el nombre local generado, no una URL pública.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [departamento_id, voucher_file]
              properties:
                departamento_id: { type: string, format: uuid }
                voucher_file: { type: string, format: binary }
      responses:
        '201':
          description: Archivo guardado y subida persistida
          content:
            application/json:
              schema:
                type: object
                required: [url_voucher, content_type, size_bytes]
                properties:
                  url_voucher: { type: string, example: '8ac169e4-3928-4e52-b75d-84a2781e44fa.jpg' }
                  content_type: { type: string, enum: [image/png, image/jpeg, application/pdf] }
                  size_bytes: { type: integer, minimum: 1, maximum: 5242880 }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '413': { description: Archivo mayor a 5 MiB }
        '422': { $ref: '#/components/responses/Error422' }
        '503': { description: Almacenamiento local no disponible }

  /pagos/solvencia/{departamento_id}:
    get:
      summary: Consultar deuda en mora desde cuotas persistidas
      operationId: consultarSolvencia
      parameters:
        - name: departamento_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Solvencia individual del departamento autorizado
          content:
            application/json:
              schema:
                type: object
                required: [departamento_id, saldo_vencido, habilitado_reservas]
                properties:
                  departamento_id: { type: string, format: uuid }
                  saldo_vencido: { type: string, example: '170.00' }
                  habilitado_reservas: { type: boolean }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /pagos/{id}/voucher:
    get:
      summary: Descargar evidencia de un comprobante autorizado
      operationId: descargarVoucher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Adjunto privado, sin caché compartida
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /pagos/{id}/resultado:
    get:
      summary: Consultar el último resultado de revisión persistido
      operationId: consultarResultadoPago
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resultado real confirmado por la junta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConciliacionResultResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /pagos/reportar:
    post:
      summary: Reporte de comprobante de pago bancario por residente
      operationId: reportarPago
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departamento_id, banco, numero_operacion, fecha_operacion, monto, url_voucher]
              properties:
                departamento_id: { type: string, format: uuid }
                banco: { type: string, enum: [YAPE, PLIN, BCP, INTERBANK, BBVA, SCOTIABANK] }
                numero_operacion: { type: string, minLength: 4, maxLength: 50 }
                fecha_operacion: { type: string, format: date }
                monto: { type: string, pattern: '^[0-9]+(\\.[0-9]{2})?$' }
                url_voucher:
                  type: string
                  description: Nombre de una subida local propia y del mismo departamento
                  example: '8ac169e4-3928-4e52-b75d-84a2781e44fa.jpg'
      responses:
        '200':
          description: Comprobante propio EN_REVISION reutilizado sin duplicar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComprobanteRecibidoResponse' }
        '202':
          description: Comprobante recibido y encolado para revisión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteRecibidoResponse'
        '409':
          description: Comprobante ya registrado o conciliado previamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pagos/{id}/conciliar:
    post:
      summary: Aprobación, observación o rechazo persistente por la Junta Directiva
      operationId: conciliarPago
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConciliarPagoRequest'
      responses:
        '200':
          description: Conciliación procesada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConciliacionResultResponse'

  /reservas:
    get:
      summary: Consultar reservas de unidades autorizadas
      operationId: listarReservas
      parameters:
        - $ref: '#/components/parameters/ContextoConsulta'
        - name: area_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: fecha
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Lista de reservas existentes para el área y fecha
    post:
      summary: Solicitud de reserva de área común (con validación de solvencia)
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva confirmada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaConfirmadaResponse'
        '403':
          description: Denegado por mora activa en cuotas vencidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Horario solicitado ocupado por otra reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    ContextoConsulta:
      name: condominio_id
      in: query
      required: false
      description: Para SUPERADMIN selecciona el contexto; para los demás debe coincidir con su JWT
      schema: { type: string, format: uuid }
    ContextoEstructura:
      name: condominio_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    ArchivoEstructura:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [archivo]
            properties:
              archivo:
                type: string
                format: binary
                description: CSV UTF-8, máximo 2 MiB y 5000 filas; numero,piso,edificio,coeficiente,total_pisos
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CrearUsuario:
      type: object
      additionalProperties: false
      required: [email, password, nombre, apellido, documento_identidad]
      properties:
        email: { type: string, format: email, maxLength: 120 }
        password: { type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true }
        nombre: { type: string, minLength: 1, maxLength: 80 }
        apellido: { type: string, minLength: 1, maxLength: 80 }
        documento_identidad: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{5,19}$' }
        telefono: { type: [string, 'null'], maxLength: 20 }
    CuentaUsuario:
      type: object
      additionalProperties: false
      required: [id, email, nombre, apellido, telefono, documento_identidad, esta_activo, creado_en]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }
        apellido: { type: string }
        telefono: { type: [string, 'null'] }
        documento_identidad: { type: string }
        esta_activo: { type: boolean }
        creado_en: { type: string, format: date-time }
    RolUsuario:
      type: string
      enum: [SUPERADMIN, ADMIN_JUNTA, AUDITOR, RESIDENTE]
    RolContextual:
      type: string
      enum: [ADMIN_JUNTA, AUDITOR, RESIDENTE]
    AsignacionRol:
      type: object
      additionalProperties: false
      required: [usuario_id, condominio_id, rol, es_activo]
      properties:
        usuario_id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        rol: { $ref: '#/components/schemas/RolUsuario' }
        es_activo: { type: boolean }
    CuentaUsuarioConRol:
      type: object
      additionalProperties: false
      required: [id, email, nombre, apellido, telefono, documento_identidad, esta_activo, creado_en, rol, rol_activo, es_superadmin]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }
        apellido: { type: string }
        telefono: { type: [string, 'null'] }
        documento_identidad: { type: string }
        esta_activo: { type: boolean }
        creado_en: { type: string, format: date-time }
        rol: { $ref: '#/components/schemas/RolUsuario' }
        rol_activo: { type: boolean }
        es_superadmin: { type: boolean, readOnly: true }
    VinculoDepartamento:
      type: object
      additionalProperties: false
      required: [departamento_id, numero, tipo_relacion, es_activo]
      properties:
        departamento_id: { type: string, format: uuid }
        numero: { type: string }
        tipo_relacion: { type: string, enum: [PROPIETARIO_TITULAR, COPROPIETARIO, INQUILINO] }
        es_activo: { type: boolean }
    UsuarioDTO:
      type: object
      required: [id, email, nombre, apellido, rol, condominio_id, departamentos]
      properties:
        id: { type: string }
        email: { type: string }
        nombre: { type: string }
        apellido: { type: string }
        rol: { $ref: '#/components/schemas/RolUsuario' }
        condominio_id: { type: [string, 'null'], format: uuid }
        departamentos: { type: array, items: { $ref: '#/components/schemas/VinculoDepartamento' } }
    DepartamentoPortal:
      type: object
      required: [id, condominio_id, numero, piso, coeficiente, saldo_a_favor, estado_financiero, activo, deuda_vencida]
      properties:
        id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        numero: { type: string }
        piso: { type: integer }
        coeficiente: { type: string }
        saldo_a_favor: { type: string }
        estado_financiero: { type: string, enum: [AL_DIA, OBSERVADO, EN_MORA] }
        activo: { type: boolean }
        deuda_vencida: { type: string }
    ComprobantePagoDTO:
      type: object
      required: [id, departamento_id, banco, numero_operacion, fecha_operacion, monto, estado, idempotency_hash, url_voucher]
      properties:
        id: { type: string, format: uuid }
        departamento_id: { type: string, format: uuid }
        banco: { type: string }
        numero_operacion: { type: string }
        fecha_operacion: { type: string, format: date }
        monto: { type: string }
        estado: { type: string, enum: [EN_REVISION, CONCILIADO, RECHAZADO] }
        idempotency_hash: { type: string }
        url_voucher: { type: string }
        motivo_rechazo: { type: [string, 'null'] }
    CrearEdificioRequest:
      type: object
      additionalProperties: false
      required: [nombre_bloque, total_pisos]
      properties:
        nombre_bloque: { type: string, minLength: 1, maxLength: 100 }
        total_pisos: { type: integer, minimum: 1, maximum: 32767 }
    EdificioResponse:
      type: object
      required: [id, condominio_id, nombre_bloque, total_pisos]
      properties:
        id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        nombre_bloque: { type: string }
        total_pisos: { type: integer, minimum: 1, maximum: 32767 }
    CrearDepartamentoRequest:
      type: object
      additionalProperties: false
      required: [numero, piso, coeficiente_participacion]
      properties:
        numero: { type: string, minLength: 1, maxLength: 20 }
        piso: { type: integer, minimum: 1, maximum: 32767 }
        coeficiente_participacion:
          type: string
          pattern: '^[0-9]{1,3}(\.[0-9]{1,4})?$'
          description: Decimal mayor que cero y menor o igual que 100, como porcentaje
          example: '0.7200'
    DepartamentoResponse:
      type: object
      required: [id, edificio_id, numero, piso, coeficiente_participacion, saldo_a_favor, estado_financiero, activo]
      properties:
        id: { type: string, format: uuid }
        edificio_id: { type: string, format: uuid }
        numero: { type: string }
        piso: { type: integer }
        coeficiente_participacion: { type: string, pattern: '^[0-9]+\.[0-9]{4}$' }
        saldo_a_favor: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
        estado_financiero: { type: string, enum: [AL_DIA, OBSERVADO, EN_MORA] }
        activo: { type: boolean }
    ImportacionEstructuraResponse:
      type: object
      required: [total_filas, nuevas, creadas, ya_existentes, rechazadas, filas]
      properties:
        total_filas: { type: integer }
        nuevas: { type: integer }
        creadas: { type: integer }
        ya_existentes: { type: integer }
        rechazadas: { type: integer }
        filas:
          type: array
          items:
            type: object
            required: [fila, numero, piso, edificio, coeficiente, total_pisos, estado, errores]
            properties:
              fila: { type: integer }
              numero: { type: string }
              piso: { type: [integer, 'null'] }
              edificio: { type: string }
              coeficiente: { type: string }
              total_pisos: { type: [integer, 'null'] }
              estado: { type: string, enum: [NUEVA, YA_EXISTENTE, ERROR, CREADA] }
              errores: { type: array, items: { type: string } }
    ConfigurarDistribucionRequest:
      type: object
      additionalProperties: false
      required: [metodo]
      properties:
        metodo:
          type: string
          enum: [POR_ALICUOTA, EQUITATIVA]
    DistribucionResponse:
      type: object
      required: [id, condominio_id, metodo, actualizado_por, actualizado_en]
      properties:
        id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        metodo:
          type: string
          enum: [POR_ALICUOTA, EQUITATIVA]
        actualizado_por: { type: string }
        actualizado_en: { type: string, format: date-time }
    CrearCondominioRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
        - direccion
        - moneda
        - regla_mora_tipo
        - dia_vencimiento
        - dias_gracia
      properties:
        nombre: { type: string, minLength: 1, maxLength: 150, example: "Villa Bonita 3" }
        direccion: { type: string, minLength: 1, maxLength: 500, example: "Av. Principal 123, Lima" }
        moneda: { type: string, enum: [PEN, USD] }
        regla_mora_tipo: { type: string, enum: [MONTO_FIJO, PORCENTAJE_SALDO] }
        monto_mora_fijo:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]{2})$'
          example: "20.00"
        tasa_mora_porcentaje:
          type: [string, 'null']
          pattern: '^(100\.0000|[0-9]{1,2}\.[0-9]{4})$'
          example: null
        dia_vencimiento: { type: integer, minimum: 1, maximum: 28, example: 20 }
        dias_gracia: { type: integer, minimum: 0, maximum: 30, example: 2 }
      oneOf:
        - title: Mora por monto fijo
          properties:
            regla_mora_tipo: { const: MONTO_FIJO }
            monto_mora_fijo: { type: string }
            tasa_mora_porcentaje: { type: 'null' }
          required: [monto_mora_fijo]
        - title: Mora porcentual sobre saldo
          properties:
            regla_mora_tipo: { const: PORCENTAJE_SALDO }
            monto_mora_fijo: { type: 'null' }
            tasa_mora_porcentaje: { type: string }
          required: [tasa_mora_porcentaje]

    CondominioResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - direccion
        - moneda
        - regla_mora_tipo
        - dia_vencimiento
        - dias_gracia
        - activo
        - creado_en
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        direccion: { type: string }
        moneda: { type: string, enum: [PEN, USD] }
        regla_mora_tipo: { type: string, enum: [MONTO_FIJO, PORCENTAJE_SALDO] }
        monto_mora_fijo: { type: [string, 'null'], example: "20.00" }
        tasa_mora_porcentaje: { type: [string, 'null'], example: null }
        dia_vencimiento: { type: integer, minimum: 1, maximum: 28 }
        dias_gracia: { type: integer, minimum: 0, maximum: 30 }
        activo: { type: boolean, const: true }
        creado_en: { type: string, format: date-time }

    CrearPresupuestoRequest:
      type: object
      additionalProperties: false
      required: [condominio_id, periodo, moneda, monto_total, fecha_vencimiento]
      properties:
        condominio_id: { type: string, format: uuid }
        periodo:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-10'
        moneda: { type: string, enum: [PEN, USD] }
        monto_total:
          type: string
          pattern: '^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          not: { const: '0.00' }
          example: '20000.00'
        fecha_vencimiento: { type: string, format: date, example: '2026-10-20' }

    ActualizarPresupuestoRequest:
      type: object
      additionalProperties: false
      required: [periodo, moneda, monto_total, fecha_vencimiento]
      properties:
        periodo:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-10'
        moneda: { type: string, enum: [PEN, USD] }
        monto_total:
          type: string
          pattern: '^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          not: { const: '0.00' }
          example: '20500.00'
        fecha_vencimiento: { type: string, format: date, example: '2026-10-20' }

    PresupuestoResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - condominio_id
        - periodo
        - moneda
        - monto_total
        - fecha_vencimiento
        - estado
        - creado_por
        - creado_en
        - aprobado_por
        - aprobado_en
        - actualizado_en
      properties:
        id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        periodo: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        moneda: { type: string, enum: [PEN, USD] }
        monto_total: { type: string, example: '20000.00' }
        fecha_vencimiento: { type: string, format: date }
        estado: { type: string, enum: [BORRADOR, APROBADO] }
        creado_por: { type: string }
        creado_en: { type: string, format: date-time }
        aprobado_por: { type: [string, 'null'] }
        aprobado_en: { type: [string, 'null'], format: date-time }
        actualizado_en: { type: string, format: date-time }

    EmitirLoteCuotasRequest:
      type: object
      additionalProperties: false
      required: [condominio_id, periodo]
      properties:
        condominio_id: { type: string, format: uuid }
        periodo: { type: string, pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$', example: "2026-10" }

    EmitirLoteCuotasResponse:
      type: object
      properties:
        lote_id: { type: string, format: uuid }
        periodo: { type: string }
        total_cuotas_emitidas: { type: integer }
        monto_total_facturado: { type: string }
        cuotas_cubiertas_saldo_favor: { type: integer }
        fecha_emision: { type: string, format: date-time }
        fecha_vencimiento: { type: string, format: date }

    ComprobanteRecibidoResponse:
      type: object
      properties:
        comprobante_id: { type: string, format: uuid }
        estado: { type: string, example: "EN_REVISION" }
        mensaje: { type: string }

    ConciliarPagoRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APROBADO, RECHAZADO, OBSERVADO] }
        motivo_rechazo: { type: string, nullable: true }
        notas_internas: { type: string, nullable: true }

    ConciliacionResultResponse:
      type: object
      properties:
        comprobante_id: { type: string, format: uuid }
        estado_final: { type: string, example: "APROBADO" }
        monto_imputado: { type: string }
        nuevo_saldo_departamento: { type: string }

    CrearReservaRequest:
      type: object
      required: [condominio_id, area_id, departamento_id, fecha_reserva, hora_inicio, hora_fin]
      properties:
        condominio_id: { type: string, format: uuid }
        area_id: { type: string, format: uuid }
        departamento_id: { type: string, format: uuid }
        fecha_reserva: { type: string, format: date }
        hora_inicio: { type: string, example: "19:00" }
        hora_fin: { type: string, example: "22:00" }

    ReservaConfirmadaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, example: "CONFIRMADA" }
        area_id: { type: string, format: uuid }
        fecha_reserva: { type: string, format: date }
        hora_inicio: { type: string }
        hora_fin: { type: string }

    ErrorResponse:
      type: object
      required: [error_code, mensaje]
      properties:
        error_code: { type: string, example: "DEUDA_MORA_ACTIVA" }
        mensaje: { type: string, example: "No es posible reservar: Su departamento mantiene cuotas vencidas pendientes." }
        detalles: { type: object }

  responses:
    Error400:
      description: Solicitud mal formada o parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Error401:
      description: Bearer ausente, inválido, expirado o SESION_DESACTUALIZADA (requiere login v2)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: NO_AUTENTICADO
            mensaje: Se requiere un Bearer Token válido.

    Error403:
      description: El rol autenticado no está autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: ACCESO_DENEGADO
            mensaje: La operación requiere el rol SUPERADMIN.

    Error404:
      description: Condominio no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: CONDOMINIO_NO_ENCONTRADO
            mensaje: No existe un condominio con el identificador solicitado.

    Error422:
      description: Datos del condominio inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: DATOS_CONDOMINIO_INVALIDOS
            mensaje: La configuración de mora no corresponde con la modalidad seleccionada.

    ErrorPresupuesto403:
      description: Rol no autorizado o condominio fuera del contexto del JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: PRESUPUESTO_ACCESO_DENEGADO
            mensaje: No tiene permisos sobre los presupuestos del condominio solicitado.

    ErrorPresupuesto404:
      description: Condominio o presupuesto solicitado no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            presupuestoNoEncontrado:
              value:
                error_code: PRESUPUESTO_NO_ENCONTRADO
                mensaje: No existe un presupuesto para el identificador o periodo solicitado.
            condominioNoEncontrado:
              value:
                error_code: CONDOMINIO_NO_ENCONTRADO
                mensaje: No existe un condominio con el identificador solicitado.

    ErrorPresupuesto409:
      description: Presupuesto duplicado o transición incompatible con su estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            periodoDuplicado:
              value:
                error_code: PRESUPUESTO_PERIODO_DUPLICADO
                mensaje: Ya existe un presupuesto para el condominio y periodo indicados.
            presupuestoNoEditable:
              value:
                error_code: PRESUPUESTO_NO_EDITABLE
                mensaje: Un presupuesto aprobado no puede modificarse ni aprobarse nuevamente.

    ErrorPresupuesto422:
      description: Periodo, moneda, monto o vencimiento inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: DATOS_PRESUPUESTO_INVALIDOS
            mensaje: El vencimiento debe pertenecer al periodo y la moneda debe coincidir con el condominio.
