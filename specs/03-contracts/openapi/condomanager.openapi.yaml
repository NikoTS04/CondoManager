openapi: 3.1.0
info:
  title: CondoManager API
  description: API formal para el Sistema Automatizado de Gestión de Pagos, Morosidad y Reservas para Condominios (SDD).
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Servidor de desarrollo local
paths:
  /health:
    get:
      summary: Comprobación de estado del servicio
      operationId: healthCheck
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  service: { type: string, example: "CondoManager Core API" }

  /cuotas/emitir-lote:
    post:
      summary: Emisión masiva mensual de cuotas ordinarias
      operationId: emitirLoteCuotas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirLoteCuotasRequest'
      responses:
        '201':
          description: Lote de cuotas emitido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitirLoteCuotasResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: Lote ya emitido previamente para este periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pagos/reportar:
    post:
      summary: Reporte de comprobante de pago bancario por residente
      operationId: reportarPago
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [departamento_id, banco, numero_operacion, fecha_operacion, monto]
              properties:
                departamento_id: { type: string, format: uuid }
                banco: { type: string, enum: [YAPE, PLIN, BCP, INTERBANK, BBVA, SCOTIABANK] }
                numero_operacion: { type: string, minLength: 4, maxLength: 30 }
                fecha_operacion: { type: string, format: date }
                monto: { type: string, pattern: '^[0-9]+(\\.[0-9]{2})?$' }
      responses:
        '202':
          description: Comprobante recibido y encolado para revisión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteRecibidoResponse'
        '409':
          description: Comprobante ya registrado o conciliado previamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pagos/{id}/conciliar:
    post:
      summary: Aprobación o rechazo de comprobante por la Junta Directiva
      operationId: conciliarPago
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConciliarPagoRequest'
      responses:
        '200':
          description: Conciliación procesada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConciliacionResultResponse'

  /usuario/crear:
    post:
      summary: Alta de usuario en el directorio (PROC-05)
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '409':
          description: Correo ya registrado en el directorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuario/roles:
    post:
      summary: Asignación de rol RBAC a un usuario dentro de un condominio
      operationId: asignarRolUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRolRequest'
      responses:
        '201':
          description: Rol asignado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRolDTO'
        '404':
          description: Usuario o condominio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Rol ya asignado al usuario en este condominio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /condominio/crear:
    post:
      summary: Alta de condominio con su configuración de mora
      operationId: crearCondominio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearCondominioRequest'
      responses:
        '201':
          description: Condominio creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondominioDTO'
        '422':
          description: Configuración de mora incoherente con la regla elegida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservas:
    get:
      summary: Consultar reservas y disponibilidad de áreas comunes
      operationId: listarReservas
      parameters:
        - name: area_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: fecha
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Lista de reservas confirmadas existentes para el área y fecha
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservaConfirmadaResponse' }
        '404':
          description: AREA_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Solicitud de reserva de área común (con validación de solvencia)
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva confirmada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaConfirmadaResponse'
        '403':
          description: Denegado por mora activa en cuotas vencidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: HORARIO_NO_DISPONIBLE - horario solicitado ocupado por otra reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: HORARIO_INVALIDO o AREA_INACTIVA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: AREA_NO_ENCONTRADA o DEPARTAMENTO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: DEPARTAMENTO_NO_PERTENECE_AL_CONDOMINIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservas/{reserva_id}/cancelar:
    post:
      summary: Cancelar una reserva confirmada (24h de anticipación salvo administrador)
      operationId: cancelarReserva
      parameters:
        - name: reserva_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarReservaRequest'
      responses:
        '200':
          description: Reserva cancelada y franja horaria liberada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelarReservaResponse'
        '404':
          description: RESERVA_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: CANCELACION_NO_PERMITIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /areas:
    get:
      summary: Catálogo de áreas comunes activas
      operationId: listarAreas
      responses:
        '200':
          description: Áreas activas del catálogo (lista vacía si no hay altas registradas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AreaComunDTO' }

  /areas/crear:
    post:
      summary: Alta de un área común en el catálogo (PROC-04)
      operationId: crearArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAreaRequest'
      responses:
        '201':
          description: Área creada y persistida en areas_comunes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaComunDTO'
        '404':
          description: CONDOMINIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: AREA_DUPLICADA - ya existe el nombre en el condominio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validaciones de aforo, costo o longitud del nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /departamentos/crear:
    post:
      summary: Alta de un departamento (unidad inmobiliaria)
      operationId: crearDepartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearDepartamentoRequest'
      responses:
        '201':
          description: Departamento creado y persistido en departamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartamentoDTO'
        '404':
          description: CONDOMINIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DEPARTAMENTO_DUPLICADO - número repetido en el condominio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validaciones de piso, coeficiente o saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    EmitirLoteCuotasRequest:
      type: object
      required: [condominio_id, periodo, presupuesto_total, fecha_vencimiento]
      properties:
        condominio_id: { type: string, format: uuid }
        periodo: { type: string, example: "2026-10" }
        presupuesto_total: { type: string, example: "20000.00" }
        fecha_vencimiento: { type: string, format: date, example: "2026-10-20" }

    EmitirLoteCuotasResponse:
      type: object
      properties:
        lote_id: { type: string, format: uuid }
        periodo: { type: string }
        total_cuotas_emitidas: { type: integer }
        monto_total_facturado: { type: string }
        cuotas_cubiertas_saldo_favor: { type: integer }

    ComprobanteRecibidoResponse:
      type: object
      properties:
        comprobante_id: { type: string, format: uuid }
        estado: { type: string, example: "EN_REVISION" }
        mensaje: { type: string }

    ConciliarPagoRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APROBADO, RECHAZADO, OBSERVADO] }
        motivo_rechazo: { type: string, nullable: true }
        notas_internas: { type: string, nullable: true }

    ConciliacionResultResponse:
      type: object
      properties:
        comprobante_id: { type: string, format: uuid }
        estado_final: { type: string, example: "APROBADO" }
        monto_imputado: { type: string }
        nuevo_saldo_departamento: { type: string }

    CrearReservaRequest:
      type: object
      required: [area_id, departamento_id, fecha_reserva, hora_inicio, hora_fin]
      properties:
        condominio_id:
          type: string
          format: uuid
          nullable: true
          description: Informativo. La fuente de verdad es el condominio del área seleccionada.
        area_id: { type: string, format: uuid }
        departamento_id:
          description: UUID del departamento o su número (ej. "302").
          oneOf:
            - type: string
              format: uuid
            - type: string
              example: "302"
        fecha_reserva: { type: string, format: date }
        hora_inicio: { type: string, example: "19:00" }
        hora_fin: { type: string, example: "22:00" }

    ReservaConfirmadaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, example: "CONFIRMADA" }
        condominio_id: { type: string, format: uuid, description: Derivado de areas_comunes.condominio_id }
        area_id: { type: string, format: uuid }
        area_nombre: { type: string, example: "Zona de Parrilla 1" }
        departamento_id: { type: string, format: uuid }
        fecha_reserva: { type: string, format: date }
        hora_inicio: { type: string }
        hora_fin: { type: string }
        costo_reserva: { type: string, example: "25.00" }
        creado_en: { type: string, format: date-time }

    CrearAreaRequest:
      type: object
      required: [condominio_id, nombre, aforo_maximo]
      properties:
        condominio_id: { type: string, format: uuid }
        nombre: { type: string, minLength: 2, maxLength: 100, example: "Zona de Parrilla 1" }
        descripcion: { type: string, maxLength: 500, nullable: true }
        aforo_maximo: { type: integer, minimum: 1, example: 12 }
        costo_reserva: { type: string, example: "25.00" }
        esta_activa: { type: boolean, default: true }

    AreaComunDTO:
      type: object
      properties:
        id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        aforo_maximo: { type: integer }
        costo_reserva: { type: string }
        esta_activa: { type: boolean }

    CrearDepartamentoRequest:
      type: object
      required: [condominio_id, numero, piso, coeficiente_participacion]
      properties:
        condominio_id: { type: string, format: uuid }
        numero: { type: string, maxLength: 20, example: "302" }
        piso: { type: integer, minimum: 1, example: 3 }
        coeficiente_participacion: { type: string, example: "0.7143" }
        saldo_a_favor: { type: string, example: "0.00" }
        estado_financiero:
          type: string
          enum: [AL_DIA, OBSERVADO, EN_MORA]
          default: AL_DIA
          description: Fuente de la invariante de solvencia del dominio de reservas.

    DepartamentoDTO:
      type: object
      properties:
        id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        numero: { type: string }
        piso: { type: integer }
        coeficiente_participacion: { type: string }
        saldo_a_favor: { type: string }
        estado_financiero: { type: string, enum: [AL_DIA, OBSERVADO, EN_MORA] }

    CancelarReservaRequest:
      type: object
      properties:
        motivo: { type: string, default: "Cancelación voluntaria por residente" }
        es_admin: { type: boolean, default: false, description: Sin restricción de 24 horas cuando es true. }

    CancelarReservaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, example: "CANCELADA" }
        mensaje: { type: string }
        fecha_cancelacion: { type: string, format: date-time }

    CrearUsuarioRequest:
      type: object
      required: [email, password, nombre, apellido, documento_identidad]
      properties:
        email: { type: string, maxLength: 120, example: "residente101@gmail.com" }
        password: { type: string, minLength: 8, maxLength: 128, description: "Se persiste únicamente como hash irreversible." }
        nombre: { type: string, minLength: 2, maxLength: 80 }
        apellido: { type: string, minLength: 2, maxLength: 80 }
        documento_identidad: { type: string, minLength: 6, maxLength: 20, description: "DNI o Carnet de Extranjería (PROC-05)." }
        telefono: { type: string, maxLength: 20, nullable: true }

    UsuarioDTO:
      type: object
      required: [id, email, nombre, apellido, documento_identidad, esta_activo, creado_en]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        nombre: { type: string }
        apellido: { type: string }
        telefono: { type: string, nullable: true }
        documento_identidad: { type: string }
        esta_activo: { type: boolean, example: true }
        creado_en: { type: string, format: date-time, example: "2026-10-07T06:00:00Z" }

    AsignarRolRequest:
      type: object
      required: [usuario_id, condominio_id, rol]
      properties:
        usuario_id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        rol: { type: string, enum: [SUPERADMIN, ADMIN_JUNTA, AUDITOR, RESIDENTE], example: "RESIDENTE" }

    UsuarioRolDTO:
      type: object
      required: [id, usuario_id, condominio_id, rol]
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        condominio_id: { type: string, format: uuid }
        rol: { type: string, example: "RESIDENTE" }

    CrearCondominioRequest:
      type: object
      required: [nombre, direccion]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 150, example: "Villa Bonita 3" }
        direccion: { type: string, minLength: 5, maxLength: 300 }
        moneda: { type: string, enum: [PEN, USD], example: "PEN" }
        regla_mora_tipo: { type: string, enum: [MONTO_FIJO, PORCENTAJE_SALDO], example: "MONTO_FIJO" }
        monto_mora_fijo: { type: string, pattern: '^[0-9]+(\.[0-9]{2})?$', example: "20.00", nullable: true }
        tasa_mora_porcentaje: { type: string, pattern: '^[0-9]+(\.[0-9]{4})?$', example: "0.0000", nullable: true }
        dias_corte: { type: integer, minimum: 1, maximum: 28, example: 20 }
        dias_gracia: { type: integer, minimum: 0, example: 2 }

    CondominioDTO:
      type: object
      required: [id, nombre, direccion, moneda, regla_mora_tipo, dias_corte, dias_gracia, creado_en]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        direccion: { type: string }
        moneda: { type: string, example: "PEN" }
        regla_mora_tipo: { type: string, example: "MONTO_FIJO" }
        monto_mora_fijo: { type: string, nullable: true, example: "20.00" }
        tasa_mora_porcentaje: { type: string, nullable: true, example: "0.0000" }
        dias_corte: { type: integer }
        dias_gracia: { type: integer }
        creado_en: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [error_code, mensaje]
      properties:
        error_code: { type: string, example: "DEUDA_MORA_ACTIVA" }
        mensaje: { type: string, example: "No es posible reservar: Su departamento mantiene cuotas vencidas pendientes." }
        detalles: { type: object }

  responses:
    Error400:
      description: Solicitud mal formada o parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
