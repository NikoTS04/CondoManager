services:
  # Broker de Mensajes y Cache Redis 7
  redis:
    image: redis:7-alpine
    container_name: condomanager-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Almacenamiento de Objetos S3 Compatible (MinIO) para Vouchers y Contratos
  minio:
    image: quay.io/minio/aistor/minio
    container_name: condomanager-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-condo_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-condo_minio_secret}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola Web
    volumes:
      - minio_data:/data

  # Backend API REST FastAPI (Python 3.12)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: condomanager-backend
    restart: unless-stopped
    environment:
      # Inyecta la conexión a Supabase definida en tu archivo .env
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - VOUCHERS_DIR=/app/uploads/vouchers
      - CONDOMINIO_PILOTO_ID=${CONDOMINIO_PILOTO_ID:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - DEMO_MODE=${DEMO_MODE:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads/vouchers:/app/uploads/vouchers
    depends_on:
      redis:
        condition: service_healthy

  cuotas-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.modules.cuotas.worker"]
    # Sin HTTP: sano mientras el proceso del worker sea el PID 1 del contenedor.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(b'src.modules.cuotas.worker' not in open('/proc/1/cmdline', 'rb').read())"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - CUOTAS_DIA_EMISION=${CUOTAS_DIA_EMISION:-1}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # CON-70: relay propio, sin alterar el worker de cuotas de otro integrante.
  pagos-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.modules.pagos.worker"]
    # Sin HTTP: sano mientras el proceso del worker sea el PID 1 del contenedor.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(b'src.modules.pagos.worker' not in open('/proc/1/cmdline', 'rb').read())"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - VOUCHERS_DIR=/app/uploads/vouchers
    volumes:
      - ./uploads/vouchers:/app/uploads/vouchers
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  notificaciones-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.modules.notificaciones.worker"]
    # Sin HTTP: sano mientras el proceso del worker sea el PID 1 del contenedor.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(b'src.modules.notificaciones.worker' not in open('/proc/1/cmdline', 'rb').read())"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Web Next.js 14 (App Router)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    container_name: condomanager-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_DEMO_MODE=${NEXT_PUBLIC_DEMO_MODE:-false}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local
